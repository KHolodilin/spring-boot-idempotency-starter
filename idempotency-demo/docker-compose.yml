services:

  postgres:
    image: postgres:16-alpine
    container_name: idempotency-demo-postgres
    environment:
      POSTGRES_DB: idempotency_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demo -d idempotency_demo" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: the demo works without Redis too (fail-open distributed cache)
  redis:
    image: redis:7-alpine
    container_name: idempotency-demo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

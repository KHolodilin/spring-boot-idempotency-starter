spring:
  application:
    name: idempotency-demo

  datasource:
    url: jdbc:postgresql://localhost:5432/idempotency_demo
    username: demo
    password: demo

  sql:
    init:
      mode: always

  data:
    redis:
      host: localhost
      port: 6379

idempotency:
  enabled: true

  fingerprint:
    algorithm: SHA-256

  local-cache:
    enabled: true
    ttl: 10m
    max-size: 10000
    statistics: true

  distributed-cache:
    enabled: true
    ttl: 1h
    key-prefix: "idempotency-demo:"
    failure-policy: fail-open

  persistence:
    enabled: true
    table-name: idempotency_records
    ttl: 365d
    lookup-before-acquire: false
    schema:
      mode: create
    cleanup:
      enabled: false

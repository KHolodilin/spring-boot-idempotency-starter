name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    name: Publish to Maven Central and create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version from tag
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Publish to Maven Central
        run: mvn -B -ntp deploy -P release -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            idempotency-core/target/idempotency-core-*.jar
            idempotency-persistence-jdbc/target/idempotency-persistence-jdbc-*.jar
            idempotency-local-cache-caffeine/target/idempotency-local-cache-caffeine-*.jar
            idempotency-distributed-cache-redis/target/idempotency-distributed-cache-redis-*.jar
            idempotency-spring-boot-starter/target/spring-boot-idempotency-starter-*.jar

name: GitHub Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag / version to publish (e.g. v0.2.0)
        required: true
        type: string
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Maven artifacts to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # workflow_dispatch: checkout the selected branch (main) so packaging config exists
        # even when republishing an older tag. Tag push: default checkout is the tagged commit.
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve version from tag
        id: version
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION from $REF"

      - name: Set release version
        run: mvn -B -ntp versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Publish to GitHub Packages
        # github-packages profile sets distributionManagement; release profile is NOT
        # activated so central-publishing-maven-plugin does not intercept deploy.
        run: mvn -B -ntp deploy -P github-packages -Dmaven.test.skip=true -Djacoco.skip=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

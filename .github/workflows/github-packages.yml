name: GitHub Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag / version to publish (e.g. v0.2.0)
        required: true
        type: string
      replace:
        description: Delete existing package versions before publish (needed to republish)
        required: false
        type: boolean
        default: true
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Maven artifacts to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # workflow_dispatch: checkout the selected branch (main) so packaging config exists
        # even when republishing an older tag. Tag push: default checkout is the tagged commit.
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve version from tag
        id: version
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION from $REF"

      - name: Remove existing packages for version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.replace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          PACKAGES=(
            com.kholodilin.spring-boot-idempotency-starter-parent
            com.kholodilin.idempotency-core
            com.kholodilin.idempotency-persistence-jdbc
            com.kholodilin.idempotency-local-cache-caffeine
            com.kholodilin.idempotency-distributed-cache-redis
            com.kholodilin.spring-boot-idempotency-starter
          )
          for pkg in "${PACKAGES[@]}"; do
            if gh api "/users/${OWNER}/packages/maven/${pkg}" >/dev/null 2>&1; then
              echo "Deleting package ${pkg}"
              gh api -X DELETE "/users/${OWNER}/packages/maven/${pkg}"
            else
              echo "Package ${pkg} not present, skip"
            fi
          done

      - name: Set release version
        run: mvn -B -ntp versions:set -DnewVersion="${{ steps.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Publish to GitHub Packages
        # github-packages: distributionManagement + disables redis test-jar profile.
        # Do not activate -P release here — that enables central-publishing-maven-plugin.
        run: >
          mvn -B -ntp deploy
          -P github-packages
          -Dmaven.test.skip=true
          -Djacoco.skip=true
          -Dspotless.check.skip=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

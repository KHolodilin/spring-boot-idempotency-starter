name: Bug report
description: Report a defect in the library
labels: [ "bug" ]
body:
  - type: input
    id: library-version
    attributes:
      label: Library version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: spring-boot-version
    attributes:
      label: Spring Boot version
      placeholder: "4.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal reproduction steps or a link to a sample project.
      placeholder: |
        1. Configure ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      render: text

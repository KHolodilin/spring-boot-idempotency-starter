name: Feature request
description: Suggest an improvement or a new capability
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not only the proposed solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? API sketches are welcome.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
